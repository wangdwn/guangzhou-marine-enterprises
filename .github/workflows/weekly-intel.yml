name: Weekly Intel Collection (手动)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect intelligence
        env:
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
        run: python3 collect_intel.py

      - name: Commit & push activity.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add activity.json
          git diff --staged --quiet || (git commit -m "📡 weekly intel $(date +%Y-%m-%d)" && git push)

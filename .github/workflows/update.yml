name: 企业情报采集(手动)
on:
  workflow_dispatch:
    inputs:
      full_scan:
        description: '全量475家扫描'
        type: boolean
        default: false
      enterprise:
        description: '指定企业名称（留空=扫描头部企业）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 执行情报采集
        run: |
          echo "=== 广海汇企业情报采集器 ==="
          ARGS=""
          if [ "${{ github.event.inputs.full_scan }}" = "true" ]; then
            ARGS="--full"
            echo "模式: 全量475家扫描"
          fi
          if [ -n "${{ github.event.inputs.enterprise }}" ]; then
            ARGS="--enterprise=${{ github.event.inputs.enterprise }}"
            echo "模式: 单企业扫描 - ${{ github.event.inputs.enterprise }}"
          fi
          python3 scraper.py $ARGS
        env:
          FULL_SCAN: "0"

      - name: 推送更新
        run: |
          git config user.name "广海汇情报机器人"
          git config user.email "bot@guangzhou-marine.org"
          if [ -f activity.json ]; then
            git add activity.json
            if git diff --cached --quiet activity.json 2>/dev/null; then
              echo "activity.json 无变化，跳过提交。"
            else
              git commit -m "chore: 更新企业情报日志 $(date +%Y-%m-%d)"
              git push
              echo "已推送最新情报数据。"
            fi
          else
            echo "activity.json 未生成，跳过。"
          fi

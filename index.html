<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广州海洋经济企业名录 · 672家官方核验动态看板</title>
    <style>
        :root { --primary: #1e3a8a; --blue: #3b82f6; --green: #0d9488; --amber: #d97706; --red: #dc2626; --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--border); flex-wrap: wrap; gap: 12px; }
        .header-left h1 { font-size: 22px; color: var(--primary); }
        .header-left p { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .btn-export { background: var(--green); } .btn-export:hover { background: #0f766e; }
        .btn-intel { background: var(--blue); } .btn-intel:hover { background: #2563eb; }
        .last-update { font-size: 11px; color: var(--muted); }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border-radius: 8px; padding: 14px 16px; border: 1px solid var(--border); }
        .stat-card h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-card .val { font-size: 28px; font-weight: 800; font-family: 'Courier New', monospace; }
        .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .stat-card.accent { border-left: 4px solid var(--blue); }
        .stat-card.gold { border-left: 4px solid var(--amber); }
        .stat-card.green { border-left: 4px solid var(--green); }
        .main-panel { background: var(--card); border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .filter-bar { padding: 14px 16px; background: #f1f5f9; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; overflow-x: auto; }
        .search-box { flex: 1; min-width: 180px; } .search-box input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        .search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
        .filter-select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 13px; outline: none; cursor: pointer; min-width: 110px; max-width: 180px; }
        .filter-select option { padding: 4px 8px; }
        .table-wrapper { overflow-y: auto; max-height: 600px; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { position: sticky; top: 0; z-index: 10; }
        th { background: #f1f5f9; padding: 12px 14px; font-weight: 600; border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
        th:hover { background: #e2e8f0; }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        tr.clickable { cursor: pointer; } tr.clickable:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 700; border-radius: 3px; white-space: nowrap; }
        .b-tier-lead { background: #fef3c7; color: #92400e; }
        .b-tier-potential { background: #f0fdf4; color: #166534; }
        .b-tier-growth { background: #e0f2fe; color: #0369a1; }
        .b-sector-eq { background: #e0f2fe; color: #0369a1; }
        .b-sector-bio { background: #f0fdf4; color: #166534; }
        .b-sector-other { background: #faf5ff; color: #6b21a8; }
        .b-sisheng { background: #fef3c7; color: #d97706; }
        .b-district { background: #f1f5f9; color: #475569; }
.b-chain-rd { background: #ede9fe; color: #5b21b6; }
.b-chain-mfg { background: #fef3c7; color: #92400e; }
.b-chain-eng { background: #dbeafe; color: #1e40af; }
.b-chain-svc { background: #f0fdf4; color: #166534; }
.b-chain-trd { background: #fce7f3; color: #9d174d; }
.b-chain-oth { background: #f1f5f9; color: #475569; }
        .table-footer { padding: 12px 16px; background: #f8fafc; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.4); backdrop-filter: blur(2px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: #fff; border-radius: 12px; max-width: 600px; width: 95%; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 85vh; overflow-y: auto; }
        .info-grid { display: grid; grid-template-columns: 110px 1fr; gap: 10px 16px; font-size: 13px; border-top: 1px solid var(--border); padding-top: 14px; margin: 14px 0; }
        .info-label { color: var(--muted); } .info-value { font-weight: 600; }
        .close-btn { background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
        @media (max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

/* ===== Tabs ===== */
.tab-nav { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
.tab-btn { padding: 10px 20px; font-size: 14px; font-weight: 600; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: .2s; }
.tab-btn:hover { color: var(--blue); }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.cycle-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-bottom: 20px; }
.cycle-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
.cycle-card-header { padding: 16px 20px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.cycle-card-header h3 { font-size: 16px; }
.cycle-card-header .stage { font-size: 22px; font-weight: 900; }
.cycle-card-body { padding: 16px 20px; }
.cycle-card-body .item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.cycle-card-body .item:last-child { border-bottom: none; }
.cycle-card-body .item .label { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
.cycle-card-body .item .label::before { content: "▸ "; }
.cycle-card-footer { padding: 12px 20px; background: #f8fafc; font-size: 13px; border-top: 1px solid var(--border); }
.stage-despair .cycle-card-header { background: #64748b; }
.stage-hope .cycle-card-header { background: var(--amber); }
.stage-growth .cycle-card-header { background: var(--blue); }
.stage-optimism .cycle-card-header { background: var(--green); }
.policy-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
.policy-table th { background: #f1f5f9; padding: 10px 14px; border-bottom: 2px solid var(--border); text-align: left; }
.policy-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.diag-box { background: #fef3c7; border-left: 4px solid var(--amber); padding: 12px 16px; margin: 12px 0; border-radius: 0 6px 6px 0; font-size: 13px; }
.diag-box.structural { background: #fee2e2; border-left-color: var(--red); }
.diag-box.cyclical { background: #e0f2fe; border-left-color: var(--blue); }
.diag-panel select { padding: 10px 14px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; min-width: 250px; }
.diag-result { display: grid; gap: 12px; }
@media (max-width: 768px) { .cycle-cards { grid-template-columns: 1fr; } }

    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-left">
            <h1>广州海洋经济企业名录 · 672家官方核验动态看板</h1>
            <p>来源：广州市规划和自然资源局 · 龙头企业/潜力企业/高成长企业清单（印发版） · 更新：2026-07-06<br>海洋工程装备126家 + 海洋生物医药16家 + 综合涉海525家 · 龙头258 / 潜力407 / 高成长218 · 四上企业519家 · 覆盖11个行政区</p>
        </div>
        <div class="header-right">
            <button class="btn btn-intel" onclick="toggleActivity()"><span id="intel-badge">📡</span> 动态情报</button>
            <button class="btn btn-export" onclick="exportCSV()">📥 导出CSV</button>
        </div>
    </header>


    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('directory')">📊 企业名录</button>
        <button class="tab-btn" onclick="switchTab('intel')">📡 情报</button>
        <button class="tab-btn" onclick="switchTab('cycle')">📈 产业周期</button>
        <button class="tab-btn" onclick="switchTab('policy')">📋 政策评估</button>
        <button class="tab-btn" onclick="switchTab('diagnosis')">🔍 困难诊断</button>
    </div>

<div class="tab-panel active" id="tab-directory">
    <div class="stats-row" id="stats-row"></div>

    <div class="main-panel">
        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="search" placeholder="搜索企业名称、主营业务..." oninput="applyFilters()">
            </div>
            <select class="filter-select" id="filter-sector" onchange="applyFilters()">
                <option value="">全部产业 (672家)</option>
                <option value="海洋工程装备">海洋工程装备</option>
                <option value="海洋生物医药">海洋生物医药</option>
                <option value="其他涉海产业">其他涉海产业</option>
            </select>
            <select class="filter-select" id="filter-sector-raw" onchange="applyFilters()">
                <option value="">全部官方产业</option>
            </select>
            <select class="filter-select" id="filter-tier" onchange="applyFilters()">
                <option value="">全部梯队</option>
                <option value="龙头">龙头</option>
                <option value="潜力">潜力</option>
                <option value="高成长">高成长</option>
            </select>
            <select class="filter-select" id="filter-district" onchange="applyFilters()">
                <option value="">全部行政区</option>
            </select>
            <select class="filter-select" id="filter-sisheng" onchange="applyFilters()">
                <option value="">全部企业</option>
                <option value="四上">仅四上企业</option>
            </select>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th onclick="sort('name')">企业名称 ↑↓</th>
                        <th onclick="sort('sector_raw')">官方产业 ↑↓</th>
                        <th onclick="sort('sector')">看板分类 ↑↓</th>
                        <th onclick="sort('tier')">梯队 ↑↓</th>
                        <th onclick="sort('sisheng')">四上 ↑↓</th>
                        <th onclick="sort('district')">行政区 ↑↓</th>
                        <th>产业链环节</th>
                        <th>标签</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div id="no-data" style="display:none; padding:40px; text-align:center; color:var(--muted);">没有匹配的企业</div>
        </div>
        <div class="table-footer">
            <span id="counter">--</span>
            <span>点击行查看企业画像</span>
        </div>
    </div>
</div>
</div>

<!-- Tab: 产业周期 -->
<div class="tab-panel" id="tab-cycle">
    <div class="cycle-cards" id="cycle-cards"></div>
</div>

<!-- Tab: 政策评估 -->
<div class="tab-panel" id="tab-policy">
    <div id="policy-content"></div>
</div>

<!-- Tab: 动态情报 -->
<div class="tab-panel" id="tab-intel">
    <div id="intel-content"></div>
</div>

<!-- Tab: 困难诊断 -->
<div class="tab-panel" id="tab-diagnosis">
    <div class="diag-panel">
        <h3 style="margin-bottom:12px">选择产业领域进行困难诊断</h3>
        <select id="diag-sector" onchange="runDiagnosis()">
            <option value="">-- 选择产业 --</option>
            <option value="海洋工程装备">海洋工程装备 (126家)</option>
            <option value="海洋生物医药">海洋生物医药 (16家)</option>
            <option value="其他涉海产业">其他涉海产业 (530家)</option>
        </select>
        <div class="diag-result" id="diag-result"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h3 id="m-name" style="color:var(--primary);">--</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="info-grid" id="m-grid"></div>
        <div style="background:#f8fafc; padding:10px; font-size:11px; border-radius:6px; color:var(--muted);">
            ✅ 数据来源：广州市规划和自然资源局官方清单
        </div>
    </div>
</div>

<script>
let enterprises = [];
let metadata = {};
let filters = { search: '', sector: '', sectorRaw: '', tier: '', district: '', sisheng: '' };
let sortKey = 'name', sortOrder = 'asc';

let activityData = null;

async function init() {
    try {
        const r = await fetch('data.json');
        const d = await r.json();
        metadata = d.metadata;
        enterprises = d.enterprises;
        
        document.getElementById('update-time').textContent = '更新: ' + metadata.lastUpdated + ' | ' + metadata.total + '家企业 | ' + metadata.source.split('·')[1];
        renderStats();
        populateFilters();
        applyFilters();
    } catch(e) {
        console.error(e);
        document.getElementById('tbody').innerHTML = '<tr><td colspan="8">数据加载失败</td></tr>';
    }
    // Load activity data
    try {
        const ar = await fetch('activity.json');
        activityData = await ar.json();
        document.getElementById('intel-badge').textContent = activityData.last_updated ? '🟢 已更新' : '📡';
        document.getElementById('intel-badge').style.color = 'var(--green)';
    } catch(e) {
        document.getElementById('intel-badge').textContent = '📡 无数据';
    }
}

function renderStats() {
    const m = metadata;
    document.getElementById('stats-row').innerHTML = `
        <div class="stat-card accent"><h3>企业总量</h3><div class="val" style="color:var(--blue);">${m.total}</div><div class="sub">官方清单核验入库</div></div>
        <div class="stat-card gold"><h3>龙头 / 潜力 / 高成长</h3><div class="val" style="color:var(--amber);">${m.tierDistribution['龙头']||0} / ${m.tierDistribution['潜力']||0} / ${m.tierDistribution['高成长']||0}</div><div class="sub">梯队分布</div></div>
        <div class="stat-card green"><h3>四上企业</h3><div class="val" style="color:var(--green);">${m.sishengCount}</div><div class="sub">${Math.round(m.sishengCount/m.total*100)}% 占比</div></div>
        <div class="stat-card"><h3>海洋工程装备 / 生物医药</h3><div class="val">${m.categories['海洋工程装备']||0} / ${m.categories['海洋生物医药']||0}</div><div class="sub">+ ${m.categories['其他涉海产业']||0} 综合涉海</div></div>
    `;
}

function populateFilters() {
    const rawSectors = new Set(), districts = new Set();
    enterprises.forEach(e => {
        if (e.sector_raw) rawSectors.add(e.sector_raw);
        if (e.district) e.district.split(' | ').forEach(d => { if(d) districts.add(d); });
    });
    
    const sel = document.getElementById('filter-sector-raw');
    [...rawSectors].sort().forEach(s => {
        const o = document.createElement('option'); o.value = s; o.textContent = s;
        sel.appendChild(o);
    });
    // Enable scroll for long dropdown
    sel.size = Math.min(rawSectors.size, 8);
    
    const dsel = document.getElementById('filter-district');
    [...districts].sort().forEach(d => {
        const o = document.createElement('option'); o.value = d; o.textContent = d;
        dsel.appendChild(o);
    });
    dsel.size = Math.min(districts.size, 8);
}

function applyFilters() {
    filters.search = document.getElementById('search').value.toLowerCase();
    filters.sector = document.getElementById('filter-sector').value;
    filters.sectorRaw = document.getElementById('filter-sector-raw').value;
    filters.tier = document.getElementById('filter-tier').value;
    filters.district = document.getElementById('filter-district').value;
    filters.sisheng = document.getElementById('filter-sisheng').value;
    renderTable();
}

function sort(key) {
    if (sortKey === key) sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortOrder = 'asc'; }
    renderTable();
}

function sectorBadge(s) {
    if (s === '海洋工程装备') return 'b-sector-eq';
    if (s === '海洋生物医药') return 'b-sector-bio';
    return 'b-sector-other';
}



function getSectorSentiment(sector) {
    if (!activityData || !activityData.history || activityData.history.length === 0) return null;
    const latest = activityData.history[activityData.history.length - 1];
    const signals = latest.signals || [];
    const keywords = sector === '海洋工程装备' ? ['装备','船舶','制造','海工'] :
                     sector === '海洋生物医药' ? ['医药','生物','制药'] :
                     ['港口','航运','物流','贸易','渔业','旅游','能源'];
    let pos = 0, neg = 0;
    signals.forEach(s => {
        const text = s.title + (s.snippet||'');
        const match = keywords.some(k => text.includes(k));
        if (match) {
            if (s.sentiment === 'positive') pos++;
            if (s.sentiment === 'negative') neg++;
        }
    });
    return { pos, neg, total: pos + neg };
}

function sentimentText(sector) {
    const s = getSectorSentiment(sector);
    if (!s || s.total === 0) return '本周无该产业相关信号';
    const ratio = s.pos / s.total * 100;
    return `本周 ${s.pos}利好 / ${s.neg}利空 · 正面率 ${Math.round(ratio)}%`;
}

function secondDerivative(sector) {
    if (!activityData || !activityData.history || activityData.history.length < 2) {
        return '需2期以上数据计算（当前仅1期）';
    }
    // Compare latest two weeks sentiment ratio
    const latest = activityData.history[activityData.history.length - 1];
    const prev = activityData.history[activityData.history.length - 2];
    // Simple: if positive ratio increased, improvement accelerating
    const keywords = sector === '海洋工程装备' ? ['装备','船舶','制造','海工'] :
                     sector === '海洋生物医药' ? ['医药','生物','制药'] :
                     ['港口','航运','物流','贸易','渔业','旅游'];
    const calc = (signals) => {
        let p = 0, n = 0;
        signals.forEach(s => {
            if (keywords.some(k => (s.title+s.snippet||'').includes(k))) {
                if (s.sentiment === 'positive') p++;
                if (s.sentiment === 'negative') n++;
            }
        });
        return { pos: p, neg: n };
    };
    const cur = calc(latest.signals||[]);
    const prv = calc(prev.signals||[]);
    if (cur.pos + cur.neg === 0 || prv.pos + prv.neg === 0) return '信号不足，无法计算';
    const curRatio = cur.pos / (cur.pos + cur.neg);
    const prvRatio = prv.pos / (prv.pos + prv.neg);
    if (curRatio > prvRatio) return '改善加速 ↑ (正面率 ' + Math.round(prvRatio*100) + '% → ' + Math.round(curRatio*100) + '%)';
    if (curRatio < prvRatio) return '改善减速 ↓ (正面率 ' + Math.round(prvRatio*100) + '% → ' + Math.round(curRatio*100) + '%)';
    return '趋势持平 →';
}

function chainBadgeClass(c) {
    if (c === '研发设计') return 'b-chain-rd';
    if (c === '装备制造') return 'b-chain-mfg';
    if (c === '工程建设') return 'b-chain-eng';
    if (c === '运营服务') return 'b-chain-svc';
    if (c === '贸易物流') return 'b-chain-trd';
    return 'b-chain-oth';
}
function renderChainBadges(e) {
    const chains = e.chain || (e.chain_primary ? [e.chain_primary] : ['其他']);
    return chains.map(c => `<span class="badge ${chainBadgeClass(c)}">${c}</span>`).join(' ');
}
function tierBadgeClass(t) {
    if (t.includes('龙头')) return 'b-tier-lead';
    if (t.includes('高成长')) return 'b-tier-growth';
    if (t.includes('潜力')) return 'b-tier-potential';
    return '';
}

function renderTable() {
    let filtered = enterprises.filter(e => {
        if (filters.search && !e.name.toLowerCase().includes(filters.search) && !(e.main_biz||'').toLowerCase().includes(filters.search)) return false;
        if (filters.sector && e.sector !== filters.sector) return false;
        if (filters.sectorRaw && e.sector_raw !== filters.sectorRaw) return false;
        if (filters.tier && !(e.tier||'').includes(filters.tier)) return false;
        if (filters.district && !(e.district||'').includes(filters.district)) return false;
        if (filters.sisheng && !e.sisheng) return false;
        return true;
    });

    filtered.sort((a, b) => {
        let va = (a[sortKey] || '').toString(), vb = (b[sortKey] || '').toString();
        if (sortKey === 'name') {
            // Chinese sorting approximation
            va = va; vb = vb;
        }
        const cmp = va < vb ? -1 : va > vb ? 1 : 0;
        return sortOrder === 'asc' ? cmp : -cmp;
    });

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = filtered.map(e => `
        <tr class="clickable" onclick="showDetail('${e.name.replace(/'/g, "\\'")}')">
            <td><strong>${e.name}</strong></td>
            <td><span class="badge" style="background:#f1f5f9;color:#475569;">${e.sector_raw}</span></td>
            <td><span class="badge ${sectorBadge(e.sector)}">${e.sector}</span></td>
            <td><span class="badge ${tierBadgeClass(e.tier)}">${e.tier||'--'}</span></td>
            <td>${e.sisheng ? '<span class="badge b-sisheng">四上</span>' : '--'}</td>
            <td>${e.district ? e.district.split(' | ').map(d => '<span class="badge b-district">'+d+'</span>').join(' ') : '--'}</td>

        </tr>
    `).join('') || '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted);">没有匹配的企业</td></tr>';

    document.getElementById('counter').textContent = `命中 ${filtered.length} / ${enterprises.length} 家企业`;
}

function exportCSV() {
    let filtered = enterprises.filter(e => {
        if (filters.search && !e.name.toLowerCase().includes(filters.search)) return false;
        if (filters.sector && e.sector !== filters.sector) return false;
        if (filters.sectorRaw && e.sector_raw !== filters.sectorRaw) return false;
        if (filters.tier && !(e.tier||'').includes(filters.tier)) return false;
        if (filters.district && !(e.district||'').includes(filters.district)) return false;
        if (filters.sisheng && !e.sisheng) return false;
        return true;
    });
    let csv = '\uFEFF企业名称,官方产业,看板分类,梯队,主营业务,企业标签,四上,营收区间,行政区,数据来源\n';
    filtered.forEach(e => { csv += `"${e.name}","${e.sector_raw||''}","${e.sector}","${e.tier||''}","${e.main_biz||''}","${e.tag||''}","${e.sisheng||''}","${e.revenue||''}","${e.district||''}","${e.source||''}"\n`; });
    const b = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `广州涉海企业_${filtered.length}家.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ===== Cycle Analysis =====
function sectorStats(sector) {
    const list = enterprises.filter(e => e.sector === sector);
    const total = list.length;
    const sisheng = list.filter(e => e.sisheng).length;
    const lead = list.filter(e => e.tier && e.tier.includes('龙头')).length;
    const growth = list.filter(e => e.tier && e.tier.includes('高成长')).length;
    const potential = list.filter(e => e.tier && e.tier.includes('潜力')).length;
    const tech = list.filter(e => e.tag && (e.tag.includes('科技') || e.tag.includes('上市') || e.tag.includes('高新'))).length;
    const districts = new Set();
    list.forEach(e => { if(e.district) e.district.split(' | ').forEach(d => districts.add(d)); });
    return { total, sisheng, lead, growth, potential, tech, districtCount: districts.size };
}

function determineStage(s) {
    const sr = s.sisheng / s.total * 100;
    const lr = s.lead / s.total * 100;
    const gr = s.growth / s.total * 100;
    if (sr > 80 && lr > 40) return { stage: '乐观', cls: 'stage-optimism', emoji: '🟢' };
    if (sr > 60 && lr > 25) return { stage: '成长', cls: 'stage-growth', emoji: '🔵' };
    if (sr > 40 && gr > 15) return { stage: '希望', cls: 'stage-hope', emoji: '🟡' };
    return { stage: '绝望', cls: 'stage-despair', emoji: '⚫' };
}

function renderCycle() {
    const sectors = ['海洋工程装备', '海洋生物医药', '其他涉海产业'];
    const cards = sectors.map(sector => {
        const s = sectorStats(sector);
        const d = determineStage(s);
        return `
        <div class="cycle-card ${d.cls}">
            <div class="cycle-card-header">
                <h3>${sector}</h3>
                <span class="stage">${d.emoji} ${d.stage}</span>
            </div>
            <div class="cycle-card-body">
                <div class="item"><div class="label">企业总量 / 四上率</div>${s.total}家 · 四上率 ${Math.round(s.sisheng/s.total*100)}%</div>
                <div class="item"><div class="label">龙头 / 潜力 / 高成长 分布</div>龙头${s.lead} · 潜力${s.potential} · 高成长${s.growth} (占比${Math.round(s.lead/s.total*100)}%/${Math.round(s.potential/s.total*100)}%/${Math.round(s.growth/s.total*100)}%)</div>
                <div class="item"><div class="label">科技/上市标签覆盖率</div>${s.tech}家 · ${Math.round(s.tech/s.total*100)}% (含上市/科技/高新标签)</div>
                <div class="item"><div class="label">行政区覆盖广度</div>${s.districtCount}个行政区</div>
                <div class="item"><div class="label">舆情情绪</div>${sentimentText(sector)}</div>
                <div class="item"><div class="label">二阶导数判断</div>${secondDerivative(sector)}</div>
            </div>
            <div class="cycle-card-footer">
                ${d.stage === '乐观' ? '建议：维持现有政策力度，关注边际衰减信号' : 
                  d.stage === '成长' ? '建议：加大政策资源投入，抢占先发优势' :
                  d.stage === '希望' ? '建议：精准扶持潜力企业，推动龙头培育' :
                  '建议：结构性诊断优先，针对短板靶向施策'}
            </div>
        </div>`;
    }).join('');
    document.getElementById('cycle-cards').innerHTML = cards;
}

// ===== Policy Evaluation =====
function renderPolicy() {
    const sectors = ['海洋工程装备', '海洋生物医药', '其他涉海产业'];
    let tableRows = sectors.map(sector => {
        const s = sectorStats(sector);
        const sent = getSectorSentiment(sector);
        let firstDeriv = '数据不足';
        let secondDeriv = '数据不足';
        let judgment = '⏳ 待评估';
        if (sent && sent.total > 0) {
            const ratio = sent.pos / sent.total * 100;
            firstDeriv = ratio >= 60 ? '↑ 向好' : ratio <= 40 ? '↓ 承压' : '→ 中性';
            if (activityData.history && activityData.history.length >= 2) {
                secondDeriv = secondDerivative(sector);
            }
            judgment = ratio >= 60 ? '🟢 政策起效' : ratio <= 40 ? '🔴 需关注' : '🟡 维持观察';

        return '<tr>' +
            '<td><strong>' + sector + '</strong></td>' +
            '<td>四上率 ' + Math.round(s.sisheng/s.total*100) + '%<br>龙头占比 ' + Math.round(s.lead/s.total*100) + '%<br>高成长 ' + Math.round(s.growth/s.total*100) + '%</td>' +

        </thead>

// ===== Difficulty Diagnosis =====
function runDiagnosis() {
    const sector = document.getElementById('diag-sector').value;
    if (!sector) { document.getElementById('diag-result').innerHTML = ''; return; }
    
    const s = sectorStats(sector);
    const sr = s.sisheng / s.total * 100;
    const lr = s.lead / s.total * 100;
    const gr = s.growth / s.total * 100;
    const tr = s.tech / s.total * 100;
    
    let items = [];
    if (sr < 50) {
        items.push({
            issue: '规模以上企业占比偏低',
            type: '结构性',
            typeClass: 'structural',
            evidence: `四上率仅${Math.round(sr)}%，${s.total - s.sisheng}家企业未达规上标准`,
            advice: '推动小微企业升规纳统，加强"小升规"专项扶持'
        });
    }
    if (lr < 20) {
        items.push({
            issue: '缺乏头部企业带动',
            type: '结构性',
            typeClass: 'structural',
            evidence: `龙头占比${Math.round(lr)}%（${s.lead}家/${s.total}家）`,
            advice: '培育产业链链主企业，引导龙头并购整合'
        });
    }
    if (gr < 15) {
        items.push({
            issue: '企业成长动能不足',
            type: '周期性',
            typeClass: 'cyclical',
            evidence: `高成长企业占比${Math.round(gr)}%（${s.growth}家）`,
            advice: '加大创新投入补贴，降低研发试错成本'
        });
    }
    if (tr < 10) {
        items.push({
            issue: '科技创新含量偏低',
            type: '结构性',
            typeClass: 'structural',
            evidence: `含科技/上市/高新的企业仅${Math.round(tr)}%（${s.tech}家）`,
            advice: '引导企业与科研院所共建实验室，强化产学研合作'
        });
    }
    if (s.districtCount < 5) {
        items.push({
            issue: '区域集聚度不足',
            type: '结构性',
            typeClass: 'structural',
            evidence: `仅覆盖${s.districtCount}个行政区`,
            advice: '推动跨区产业协作，建设海洋经济专业园区'
        });
    }
    
    if (items.length === 0) {
        items.push({
            issue: '各项指标均在健康范围',
            type: '无显著困难',
            typeClass: '',
            evidence: '四上率、龙头占比、成长动能等核心指标表现良好',
            advice: '保持现有政策力度，重点关注边际变化'
        });
    }
    
    document.getElementById('diag-result').innerHTML = 
        `<h4 style="margin-bottom:8px;">${sector} · 困难诊断</h4>` +
        items.map(i => `
        <div class="diag-box ${i.typeClass}">
            <strong>${i.issue}</strong> · <span style="font-size:12px;">${i.type}</span>
            <div style="margin-top:6px;"><strong>证据：</strong>${i.evidence}</div>
            <div style="margin-top:4px;"><strong>建议：</strong>${i.advice}</div>
        </div>`).join('') +
        `<div style="font-size:12px; color:var(--muted); margin-top:12px;">
            ⚠ 敏感性提示：本诊断基于结构数据快照，若判断有误，最可能错在——周期vs结构边界模糊（当前数据无时间维度）。建议接入activity.json时间序列后复核。
        </div>`;
}
